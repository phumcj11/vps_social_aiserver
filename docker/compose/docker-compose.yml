# =============================================================================
# KMKT Social AI — Docker Compose foundation (SPRINT 001)
# =============================================================================
# This is a FOUNDATION only. Do NOT start it in this sprint.
#
# Safety & networking rules encoded here:
#   - MySQL is NOT published to the host/public — internal `expose` only.
#   - n8n is NOT publicly exposed and is gated behind the `n8n` profile.
#   - The API binds internally (no public port publish).
#   - The web app, when run, binds to loopback (127.0.0.1) only.
#   - Workers are gated behind the `workers` profile → disabled by default.
#   - The Facebook COMMENT (write) worker never starts automatically and is
#     additionally gated by the kill switch / write flags in its own runtime.
#   - Named volumes for all persistent data; conservative CPU/memory limits
#     sized for a 2-core / 3.8 GiB host (services are not all meant to run at
#     full size simultaneously).
#
# Env values come from the repo-root .env (copied from .env.example). No real
# secrets live in this file or in .env.example.
# -----------------------------------------------------------------------------

name: kmkt-social-ai

x-restart-policy: &restart_policy
  restart: 'no'

networks:
  internal:
    driver: bridge

volumes:
  mysql-data:
    name: kmkt_mysql_data
  n8n-data:
    name: kmkt_n8n_data

services:
  # --- Database -------------------------------------------------------------
  mysql:
    image: mysql:8.0
    <<: *restart_policy
    # SPRINT 017 production hardening: DB must return after host reboot;
    # an intentional operator `docker stop` still stays stopped until started.
    restart: unless-stopped
    env_file:
      - path: ../../.env
        required: false
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-kmkt_social_ai}
      MYSQL_USER: ${MYSQL_USER:-kmkt_social_ai}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me_root}
    # Reachable from other services on the `internal` network. Also published on
    # the host LOOPBACK ONLY (127.0.0.1) so host-run migrations/tools can connect
    # during development. This is NOT a public port — it never binds 0.0.0.0.
    expose:
      - '3306'
    ports:
      - '127.0.0.1:3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test:
        ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-p${MYSQL_ROOT_PASSWORD:-change_me_root}']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M

  # --- Backend API ----------------------------------------------------------
  api:
    build:
      context: ../..
      dockerfile: docker/api.Dockerfile
    <<: *restart_policy
    env_file:
      - path: ../../.env
        required: false
    environment:
      API_HOST: 0.0.0.0 # binds only within the internal compose network
      API_PORT: ${API_PORT:-3001}
    # INTERNAL ONLY — no public port publish. Reachable from web/n8n via the
    # `internal` network. A loopback mapping can be added locally if needed.
    expose:
      - '${API_PORT:-3001}'
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+(process.env.API_PORT||3001)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 384M

  # --- Web frontend ---------------------------------------------------------
  web:
    build:
      context: ../..
      dockerfile: docker/web.Dockerfile
    <<: *restart_policy
    env_file:
      - path: ../../.env
        required: false
    environment:
      WEB_PORT: ${WEB_PORT:-3000}
    # Loopback only — bound to 127.0.0.1 on the host, never public.
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
    depends_on:
      - api
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M

  # --- n8n (orchestration, reserved) ---------------------------------------
  # Gated behind the `n8n` profile so it never starts by default, and NOT
  # publicly exposed. It orchestrates by calling the API; it is not a source of
  # truth (docs/07-system-overview.md).
  n8n:
    image: n8nio/n8n:latest
    <<: *restart_policy
    profiles:
      - n8n
    env_file:
      - path: ../../.env
        required: false
    environment:
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
    # INTERNAL ONLY — no public port publish.
    expose:
      - '5678'
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      - api
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # --- Facebook scanner worker (READ-ONLY, reserved) ------------------------
  # Gated behind the `workers` profile → disabled by default.
  facebook-scanner:
    build:
      context: ../..
      dockerfile: docker/worker.Dockerfile
      args:
        WORKER_DIR: workers/facebook-scanner
    <<: *restart_policy
    profiles:
      - workers
    env_file:
      - path: ../../.env
        required: false
    depends_on:
      api:
        condition: service_started
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 700M

  # --- Facebook comment worker (WRITE, reserved) ----------------------------
  # Gated behind the `comment-worker` profile so it NEVER starts automatically
  # (not even with the `workers` profile). At runtime it is additionally blocked
  # by GLOBAL_KILL_SWITCH and FACEBOOK_WRITE_ACTION_ENABLED.
  facebook-comment:
    build:
      context: ../..
      dockerfile: docker/worker.Dockerfile
      args:
        WORKER_DIR: workers/facebook-comment
    <<: *restart_policy
    profiles:
      - comment-worker
    env_file:
      - path: ../../.env
        required: false
    depends_on:
      api:
        condition: service_started
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 700M
